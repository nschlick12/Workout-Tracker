<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Workout Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .tab-content { display: none; }
        .tab-content.active { display: flex; flex-direction: column; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden select-none">

    <!-- TOP HEADER -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center shrink-0">
        <h1 class="text-lg font-bold tracking-tight text-blue-400">Workout Tracker</h1>
        <button onclick="resetData()" class="text-xs text-slate-400 hover:text-red-400 px-2 py-1 rounded bg-slate-800">Reset Data</button>
    </header>

    <!-- MAIN APP CONTAINER -->
    <main id="main-container" class="flex-1 overflow-y-auto p-4 space-y-4 pb-24">

        <!-- PLAN TAB -->
        <section id="tab-plan" class="tab-content active space-y-3">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">5-Day Blueprint</h2>
            <div id="blueprint-list" class="space-y-3">
                <!-- Injected via JS -->
            </div>
        </section>

        <!-- TIMER TAB -->
        <section id="tab-timer" class="tab-content space-y-4 text-center">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-lg">
                <h2 id="timer-title" class="text-sm font-semibold uppercase tracking-wider text-blue-400 mb-2">Ready</h2>
                <div id="timer-display" class="text-6xl font-ext500 tracking-tighter text-white font-mono my-4">40</div>
                <div id="timer-status" class="text-sm text-slate-400 mb-6">Work Interval</div>
                
                <div class="flex justify-center gap-3">
                    <button onclick="startTimer()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl shadow">Start</button>
                    <button onclick="pauseTimer()" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold px-6 py-3 rounded-xl shadow">Pause</button>
                    <button onclick="resetTimer()" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold px-6 py-3 rounded-xl shadow">Reset</button>
                </div>
            </div>
        </section>

        <!-- LOG TAB -->
        <section id="tab-log" class="tab-content space-y-4">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Log Workout</h2>
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Select Day</label>
                    <select id="log-day-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500">
                        <option value="Day 1">Day 1: Med-High Strength & Conditioning</option>
                        <option value="Day 2">Day 2: Low-Intensity Incline Walk</option>
                        <option value="Day 3">Day 3: Med-High Kettlebell & Functional</option>
                        <option value="Day 4">Day 4: Low-Intensity Core & Mobility</option>
                        <option value="Day 5">Day 5: Med-High Custom AMRAP</option>
                    </select>
                </div>

                <div id="log-exercises-container" class="space-y-3">
                    <!-- Dynamic exercise inputs -->
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Rounds Completed</label>
                    <input type="number" id="log-rounds" value="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-center text-lg font-bold">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">How did it feel?</label>
                    <textarea id="log-notes" rows="2" placeholder="Notes on energy, joints, etc..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-blue-500"></textarea>
                </div>

                <button onclick="saveWorkout()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 rounded-xl shadow-lg">Save Workout</button>
            </div>
        </section>

        <!-- HISTORY TAB -->
        <section id="tab-history" class="tab-content space-y-3">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Workout History</h2>
            <div id="history-list" class="space-y-3">
                <!-- Injected via JS -->
            </div>
        </section>

    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bg-slate-900 border-t border-slate-800 h-16 shrink-0 grid grid-cols-4 items-center px-2">
        <button onclick="switchTab('plan')" id="nav-plan" class="flex flex-col items-center justify-center text-blue-400">
            <span class="text-xs font-medium mt-1">Plan</span>
        </button>
        <button onclick="switchTab('timer')" id="nav-timer" class="flex flex-col items-center justify-center text-slate-400">
            <span class="text-xs font-medium mt-1">Timer</span>
        </button>
        <button onclick="switchTab('log')" id="nav-log" class="flex flex-col items-center justify-center text-slate-400">
            <span class="text-xs font-medium mt-1">Log</span>
        </button>
        <button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center justify-center text-slate-400">
            <span class="text-xs font-medium mt-1">History</span>
        </button>
    </nav>

    <script>
        const blueprint = [
            { day: "Day 1", title: "Med-High Strength & Conditioning", details: "Sumo Squats: 40lb KB (10 reps)\nFloor Press: 50lb DBs (10 reps)\nKickstand Deadlifts: 20lb KB (8 reps)\nBent-Over Rows: 30lb DBs (10 reps)\nFarmer's Carry: 55lb DB (40s alt)" },
            { day: "Day 2", title: "Low-Intensity Incline Walk", details: "Incline Treadmill Walk\nIncline: 5%–8%\nSpeed: 2.8–3.2 mph\nDuration: 30-35 min" },
            { day: "Day 3", title: "Med-High Kettlebell & Functional", details: "Goblet Squats, Carries, Seated/Supported Rows, RDLs, KB Swings" },
            { day: "Day 4", title: "Low-Intensity Core & Mobility", details: "Dead Bugs, Russian Twists, Pallof Press, Band Rotations, Face Pulls" },
            { day: "Day 5", title: "Med-High Custom AMRAP", details: "Single-weight flow: Thrusters, Gorilla Rows, SDHP, Floor Pullover/Bridge" }
        ];

        let historyData = JSON.parse(localStorage.getItem('workout_history') || '[]');

        function init() {
            renderBlueprint();
            renderHistory();
            setupLogForm();
            document.getElementById('log-day-select').addEventListener('change', setupLogForm);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.replace('text-blue-400', 'text-slate-400'));
            
            document.getElementById(`tab-${tabName}`).classList.add('active');
            document.getElementById(`nav-${tabName}`).classList.replace('text-slate-400', 'text-blue-400');
            document.getElementById('main-container').scrollTop = 0;
        }

        function renderBlueprint() {
            const container = document.getElementById('blueprint-list');
            container.innerHTML = blueprint.map(item => `
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4">
                    <div class="text-xs font-semibold text-blue-400 mb-1">${item.day}</div>
                    <div class="text-base font-bold text-white mb-2">${item.title}</div>
                    <div class="text-sm text-slate-300 whitespace-pre-line bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">${item.details}</div>
                </div>
            `).join('');
        }

        function setupLogForm() {
            const selectedDay = document.getElementById('log-day-select').value;
            const container = document.getElementById('log-exercises-container');
            
            let defaultExercises = [];
            if (selectedDay === 'Day 1') {
                defaultExercises = [
                    { name: 'Sumo Squats', load: '40lb KB', reps: '10' },
                    { name: 'Floor Press', load: '50lb DBs', reps: '10' },
                    { name: 'Kickstand Deadlifts', load: '20lb KB', reps: '8' },
                    { name: 'Bent-Over Rows', load: '30lb DBs', reps: '10' },
                    { name: 'Farmer\'s Carry', load: '55lb DB', reps: '40s alt' }
                ];
            } else {
                defaultExercises = [{ name: 'Custom Exercise', load: '', reps: '' }];
            }

            container.innerHTML = defaultExercises.map((ex, i) => `
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-700 space-y-2 exercise-row">
                    <input type="text" value="${ex.name}" class="ex-name w-full bg-transparent text-sm font-semibold text-white focus:outline-none border-b border-slate-800 pb-1">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" value="${ex.load}" placeholder="Load / Weight" class="ex-load bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white">
                        <input type="text" value="${ex.reps}" placeholder="Reps / Time" class="ex-reps bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white">
                    </div>
                </div>
            `).join('');
        }

        function saveWorkout() {
            const day = document.getElementById('log-day-select').value;
            const rounds = document.getElementById('log-rounds').value;
            const notes = document.getElementById('log-notes').value;
            
            const rows = document.querySelectorAll('.exercise-row');
            const exercises = Array.from(rows).map(row => ({
                name: row.querySelector('.ex-name').value,
                load: row.querySelector('.ex-load').value,
                reps: row.querySelector('.ex-reps').value
            }));

            const entry = {
                id: Date.now(),
                date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                day,
                rounds,
                exercises,
                notes
            };

            historyData.unshift(entry);
            localStorage.setItem('workout_history', JSON.stringify(historyData));
            renderHistory();
            
            document.getElementById('log-notes').value = '';
            switchTab('history');
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            if (historyData.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-8 text-sm">No workouts logged yet.</div>`;
                return;
            }

            container.innerHTML = historyData.map(item => `
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-semibold text-blue-400">${item.day} — ${item.date}</span>
                        <span class="text-xs bg-slate-700 px-2 py-0.5 rounded-full text-slate-300">${item.rounds} Rounds</span>
                    </div>
                    <div class="space-y-1 pt-1">
                        ${item.exercises.map(ex => `<div class="text-xs text-slate-300 flex justify-between"><span>${ex.name}</span><span class="text-slate-400">${ex.load} (${ex.reps})</span></div>`).join('')}
                    </div>
                    ${item.notes ? `<div class="text-xs text-slate-400 italic pt-2 border-t border-slate-700/50">"${item.notes}"</div>` : ''}
                </div>
            `).join('');
        }

        function resetData() {
            if (confirm('Clear all history?')) {
                localStorage.removeItem('workout_history');
                historyData = [];
                renderHistory();
            }
        }

        let timerInterval = null;
        let timeLeft = 40;
        let isWork = true;

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft < 0) {
                    isWork = !isWork;
                    timeLeft = isWork ? 40 : 20;
                    document.getElementById('timer-status').innerText = isWork ? "Work Interval" : "Rest Period";
                }
                document.getElementById('timer-display').innerText = timeLeft;
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = 40;
            isWork = true;
            document.getElementById('timer-display').innerText = timeLeft;
            document.getElementById('timer-status').innerText = "Work Interval";
        }

        init();
    </script>
</body>
</html>
